[package]
name = "ownblock"
version = "0.1.0"
description = "OwnBlock: Programmable Co-Buying, Legal Escrow & Dual-Tranche On-Chain Mortgage Protocol on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ownblock"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
